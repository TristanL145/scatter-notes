name: Bug Report
description: Report a bug or unexpected behavior in Scatter Notes.
title: "[Bug]: "
labels:
  - "bug"
  - "triage"
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting a bug! Please check existing issues first, and never include sensitive personal notes or secrets.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform are you running Scatter Notes on?
      options:
        - Android
        - iOS
        - Windows
        - macOS
        - Linux
        - Web
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version / Commit
      placeholder: e.g., v0.1.0 or commit SHA
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open a note in Class "CS 301"
        2. Trigger the Cornell Flow nudge
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant stack traces or attach screenshots (scrub any private note content).
    validations:
      required: false
