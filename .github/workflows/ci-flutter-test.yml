name: "CI: Flutter Test"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run unit & widget tests
        working-directory: app
        run: flutter test
