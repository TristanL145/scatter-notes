name: CD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag / build name (e.g., v0.1.0)
        required: false
        type: string
        default: ""
      publish_release:
        description: Create a draft GitHub Release when a release_tag is provided
        required: false
        type: boolean
        default: false
      prerelease:
        description: Mark the draft GitHub Release as a pre-release
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci-flutter-test.yml

  android-build:
    name: android-build
    needs:
      - verify
    uses: ./.github/workflows/cd-android-build.yml
    with:
      build_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    secrets: inherit

  github-release:
    name: github-release
    needs:
      - android-build
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish_release == true && inputs.release_tag != '')
    permissions:
      contents: write
    uses: ./.github/workflows/cd-github-release.yml
    with:
      tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
      prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || (github.event_name != 'workflow_dispatch' && contains(github.ref_name, '-')) }}
