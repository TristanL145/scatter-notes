name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: repo-hygiene
    uses: ./.github/workflows/ci-repo-hygiene.yml

  flutter-format:
    name: flutter-format
    uses: ./.github/workflows/ci-flutter-format.yml

  flutter-analyze:
    name: flutter-analyze
    uses: ./.github/workflows/ci-flutter-analyze.yml

  flutter-test:
    name: flutter-test
    uses: ./.github/workflows/ci-flutter-test.yml

  flutter-build-android:
    name: flutter-build-android
    needs:
      - flutter-format
      - flutter-analyze
      - flutter-test
    uses: ./.github/workflows/ci-flutter-build-android.yml
